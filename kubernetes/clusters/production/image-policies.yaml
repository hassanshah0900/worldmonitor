apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: worldmonitor-full
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: worldmonitor-full
  filterTags:
    pattern: '^(?P<num>[0-9]+)-.*$'
    extract: '$num'
  policy:
    numerical:
      order: asc
---
