# Cluster-wide infrastructure, installed once per cluster — not specific
# to worldmonitor, and not scoped to any one namespace like dashboard/redis/
# redis-rest/ais-relay are. Nothing here is namespaced.
#
# Before applying cluster-issuer.yaml, both of these controllers must
# already be installed (their own release manifests, not vendored into
# this repo — they have their own versioning/release cadence):
#
#   # ingress-nginx controller
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.3/deploy/static/provider/cloud/deploy.yaml
#
#   # cert-manager (CRDs + controller)
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.2/cert-manager.yaml
#
# Check each project's release page for the current version before
# installing — the pinned versions above will go stale.
#
# Then:
#   kubectl apply -k kubernetes/cluster-infra
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - cluster-issuer.yaml
