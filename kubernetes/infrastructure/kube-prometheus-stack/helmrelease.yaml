apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 10m0s
  targetNamespace: monitoring
  install:
    createNamespace: true
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 88.6.3
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    prometheus:
      prometheusSpec:
        retention: 15d
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: gp3
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi
    grafana:
      admin:
        # From ../kube-prometheus-stack-config's ExternalSecret — that
        # directory's own Kustomization depends on this one, so the secret
        # only gets created once this HelmRelease (and the monitoring
        # namespace it creates) is up.
        existingSecret: grafana-admin-credentials
        userKey: admin-user
        passwordKey: admin-password
      ingress:
        enabled: true
        ingressClassName: alb
        annotations:
          # Same ALB as kubernetes/apps/dashboard/shared/ingress.yaml —
          # see that file's group.name annotation.
          alb.ingress.kubernetes.io/group.name: worldmonitor
          alb.ingress.kubernetes.io/scheme: internet-facing
          alb.ingress.kubernetes.io/target-type: ip
          alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
          alb.ingress.kubernetes.io/ssl-redirect: "443"
          # Same cert as kubernetes/apps/dashboard/shared/ingress.yaml — its
          # wildcard SAN (*.worldmonitor.alwahaj-ac-repair.com) already
          # covers this host, and it's the same ALB group.
          alb.ingress.kubernetes.io/certificate-arn: "${CERTIFICATE_ARN}"
        hosts:
          - grafana.worldmonitor.alwahaj-ac-repair.com
