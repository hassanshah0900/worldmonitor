# Single shared instance — no variant overlays. See memory: all six
# dashboard variants and ais-relay talk to this one proxy.
#
#   kubectl apply -k kubernetes/redis-rest
#
# secret.example.yaml is a template, not a resource here — see its header.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
