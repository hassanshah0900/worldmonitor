# This directory's Kustomization depends on worldmonitor-infra-kube-prometheus-stack
# (creates the monitoring namespace) and worldmonitor-infra-external-secrets-config
# (creates the ClusterSecretStore this references) — same CRD-ordering reasoning
# as ../../external-secrets/config/cluster-secret-store.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: grafana-admin-credentials
  data:
    - secretKey: admin-user
      remoteRef:
        key: worldmonitor
        property: GRAFANA_ADMIN_USER
    - secretKey: admin-password
      remoteRef:
        key: worldmonitor
        property: GRAFANA_ADMIN_PASSWORD
