# Applies after worldmonitor-infra-controllers, which is what creates both
# the monitoring namespace (kube-prometheus-stack's HelmRelease) and the
# external-secrets CRDs this resource needs — same reasoning as
# ../secret-store/cluster-secret-store.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: grafana-admin-credentials
  data:
    - secretKey: admin-user
      remoteRef:
        key: worldmonitor
        property: GRAFANA_ADMIN_USER
    - secretKey: admin-password
      remoteRef:
        key: worldmonitor
        property: GRAFANA_ADMIN_PASSWORD
