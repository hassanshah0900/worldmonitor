# Template only — NOT a kustomize resource (not listed in kustomization.yaml).
# Copy, fill in real values, and apply directly (or generate the same Secret
# via `kubectl create secret generic worldmonitor-secrets --from-literal=...`,
# or through whatever secrets manager the cluster uses — sealed-secrets,
# external-secrets, Vault, etc.). Never commit a filled-in copy of this file.
apiVersion: v1
kind: Secret
metadata:
  name: worldmonitor-secrets
type: Opaque
stringData:
  # Required — generate with: openssl rand -hex 32
  UPSTASH_REDIS_REST_TOKEN: ""
  WM_SESSION_SECRET: ""
  RELAY_SHARED_SECRET: ""

  # AI summarization — optional, features degrade gracefully without them
  GROQ_API_KEY: ""
  OPENROUTER_API_KEY: ""
  LLM_API_KEY: ""

  # Data source API keys — optional, features degrade gracefully without them
  AISSTREAM_API_KEY: ""
  FINNHUB_API_KEY: ""
  EIA_API_KEY: ""
  FRED_API_KEY: ""
  ACLED_EMAIL: ""
  ACLED_PASSWORD: ""
  ACLED_ACCESS_TOKEN: ""
  NASA_FIRMS_API_KEY: ""
  CLOUDFLARE_API_TOKEN: ""
  AVIATIONSTACK_API: ""
  TRAVELPAYOUTS_API_TOKEN: ""
