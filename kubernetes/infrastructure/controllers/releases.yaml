apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m0s
  targetNamespace: cert-manager
  install:
    createNamespace: true
  chart:
    spec:
      chart: cert-manager
      version: v1.16.2
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  values:
    installCRDs: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: flux-system
spec:
  interval: 10m0s
  targetNamespace: ingress-nginx
  install:
    createNamespace: true
  chart:
    spec:
      chart: ingress-nginx
      version: 4.11.3
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
  values:
    controller:
      # No cloud-controller-manager on a self-managed cluster, so a
      # Service type: LoadBalancer (the chart default) would sit Pending
      # forever. Instead run one pod per node on the host network, so the
      # ALB (terraform/modules/alb) can reach it on each worker's node IP.
      kind: DaemonSet
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      service:
        type: ClusterIP
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 10m0s
  targetNamespace: external-secrets
  install:
    createNamespace: true
  chart:
    spec:
      chart: external-secrets
      version: 2.10.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cluster-autoscaler
  namespace: flux-system
spec:
  interval: 10m0s
  targetNamespace: kube-system
  chart:
    spec:
      chart: cluster-autoscaler
      # Chart 9.37.0 -> appVersion 1.30.0. Keep this matched to
      # terraform/environments/production's kubernetes_version — cluster-autoscaler
      # only supports a small skew from the control-plane's k8s version.
      version: 9.37.0
      sourceRef:
        kind: HelmRepository
        name: autoscaler
        namespace: flux-system
  values:
    cloudProvider: aws
    # Must match terraform/environments/production's aws_region.
    awsRegion: us-east-1
    autoDiscovery:
      # Must match local.cluster_name ("${var.project}-${var.environment}")
      # in terraform/modules/workers/main.tf — this is how the ASG tag
      # k8s.io/cluster-autoscaler/<name>=owned gets discovered.
      clusterName: worldmonitor-production
    # No OIDC/IRSA on a self-managed cluster — AWS credentials come from the
    # worker node's EC2 instance profile (terraform/modules/workers), which
    # already carries the scoped autoscaling IAM policy.
    rbac:
      serviceAccount:
        create: true
