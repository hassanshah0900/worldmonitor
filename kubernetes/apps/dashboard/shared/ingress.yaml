apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: worldmonitor
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # Paste your ACM cert ARN here directly — Terraform no longer manages the ALB.
    alb.ingress.kubernetes.io/certificate-arn: "REPLACE_WITH_your_acm_certificate_arn"
spec:
  ingressClassName: alb
  rules:
    - host: worldmonitor.alwahaj-ac-repair.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: worldmonitor-full
                port:
                  name: http
    - host: tech.worldmonitor.alwahaj-ac-repair.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: worldmonitor-tech
                port:
                  name: http
    - host: finance.worldmonitor.alwahaj-ac-repair.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: worldmonitor-finance
                port:
                  name: http
    - host: happy.worldmonitor.alwahaj-ac-repair.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: worldmonitor-happy
                port:
                  name: http
    - host: commodity.worldmonitor.alwahaj-ac-repair.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: worldmonitor-commodity
                port:
                  name: http
    - host: energy.worldmonitor.alwahaj-ac-repair.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: worldmonitor-energy
                port:
                  name: http