# Cluster-scoped (not namespaced) — every ExternalSecret in the repo
# references this by name. external-secrets is installed via
# ../../controllers's HelmRelease; the worldmonitor-infra-configs Flux
# Kustomization depends on worldmonitor-infra-controllers so this only
# applies once its CRDs exist.
#
# IRSA: the referenced ServiceAccount is annotated with an IAM role ARN
# (see terraform/modules/eks-cluster's external_secrets IRSA role, wired
# into the external-secrets HelmRelease in ../../controllers/releases.yaml).
# No AWS credentials are stored in the cluster or in git.
#
# region must match terraform/environments/production's aws_region.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
