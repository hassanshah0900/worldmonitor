# Template only — NOT a kustomize resource. Copy, fill in real values, and
# apply directly or via kubectl create secret. Never commit a filled-in copy.
#
# RELAY_SHARED_SECRET must match the same key in
# kubernetes/dashboard/shared/secret.example.yaml — the dashboard and this relay
# authenticate to each other with it. UPSTASH_REDIS_REST_TOKEN must match
# SRH_TOKEN in kubernetes/redis-rest/secret.example.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: ais-relay-secrets
type: Opaque
stringData:
  # Generate with: openssl rand -hex 32
  RELAY_SHARED_SECRET: ""
  UPSTASH_REDIS_REST_TOKEN: ""

  # Optional — features degrade gracefully without them
  AISSTREAM_API_KEY: ""
  FINNHUB_API_KEY: ""
  UCDP_ACCESS_TOKEN: ""
