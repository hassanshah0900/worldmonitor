# Applied once per namespace, independent of variant — every variant
# Deployment (see ../overlays/<variant>) points at these same names via
# envFrom, so they are never nameSuffixed the way the per-variant
# Deployment/Service are. ingress.yaml similarly hardcodes each variant's
# already-known suffixed Service name directly, rather than relying on
# per-overlay Ingress patches.
#
# Apply this AFTER all six variant overlays (ingress.yaml's backends must
# already exist for ingress-nginx to route to them), and after
# kubernetes/cluster-infra (cert-manager + the ClusterIssuers it
# references) and the ingress-nginx controller itself are installed:
#
#   kubectl apply -k kubernetes/dashboard/shared
#
# secret.example.yaml is a template, not a resource here — see its header.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - ingress.yaml
