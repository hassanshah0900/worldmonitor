apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-rest
  labels:
    app.kubernetes.io/name: redis-rest
    app.kubernetes.io/component: cache-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-rest
      app.kubernetes.io/component: cache-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-rest
        app.kubernetes.io/component: cache-proxy
    spec:
      containers:
        - name: redis-rest
          # Built from docker/Dockerfile.redis-rest — see
          # .github/workflows/learning-deployment.yml for the build step.
          image: syedhassanshah/worldmonitor-redis-rest:latest
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - secretRef:
                name: redis-rest-secrets
          # The proxy buffers each accepted request body in full
          # (SRH_MAX_BODY_BYTES, 16MB default), so concurrent large publishes
          # multiply. docker-compose.yml measured ~933MB RSS at 64 concurrent
          # 16MB POSTs — bound it here the same way, at 512Mi.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          # No unauthenticated route exists on this proxy (every path expects
          # a bearer token), so an httpGet probe would read a 401 as failure.
          # tcpSocket only proves the process is listening.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
