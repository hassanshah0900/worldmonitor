# Cluster-scoped (not namespaced) — every ExternalSecret in the repo
# references this by name. external-secrets is installed via ../helm's
# HelmRelease; the cluster-infra-secret-store Flux Kustomization depends
# on cluster-infra-helm so this only applies once its CRDs exist.
#
# No auth block: the AWS SDK falls back to whatever credentials are
# available to the pod, which on an EC2-hosted node means the instance's
# IAM role. No AWS credentials are stored in the cluster or in git.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
