# Replaces the manual copy-secret.example.yaml-and-apply workflow. Pulls
# from AWS Secrets Manager via ../../cluster-infra/secret-store's
# ClusterSecretStore. All four components' ExternalSecrets read from the
# same "worldmonitor" AWS secret (one $0.40/mo secret instead of four) and
# each cherry-picks only its own keys via `data`, rather than `dataFrom:
# extract` — extract would copy every key in "worldmonitor" into this
# component's Secret too, widening blast radius if this pod were compromised.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: worldmonitor-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: worldmonitor-secrets
  data:
    - secretKey: UPSTASH_REDIS_REST_TOKEN
      remoteRef:
        key: worldmonitor
        property: UPSTASH_REDIS_REST_TOKEN
    - secretKey: WM_SESSION_SECRET
      remoteRef:
        key: worldmonitor
        property: WM_SESSION_SECRET
    - secretKey: RELAY_SHARED_SECRET
      remoteRef:
        key: worldmonitor
        property: RELAY_SHARED_SECRET
    - secretKey: GROQ_API_KEY
      remoteRef:
        key: worldmonitor
        property: GROQ_API_KEY
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: worldmonitor
        property: OPENROUTER_API_KEY
    - secretKey: LLM_API_KEY
      remoteRef:
        key: worldmonitor
        property: LLM_API_KEY
    - secretKey: AISSTREAM_API_KEY
      remoteRef:
        key: worldmonitor
        property: AISSTREAM_API_KEY
    - secretKey: FINNHUB_API_KEY
      remoteRef:
        key: worldmonitor
        property: FINNHUB_API_KEY
    - secretKey: EIA_API_KEY
      remoteRef:
        key: worldmonitor
        property: EIA_API_KEY
    - secretKey: FRED_API_KEY
      remoteRef:
        key: worldmonitor
        property: FRED_API_KEY
    - secretKey: ACLED_EMAIL
      remoteRef:
        key: worldmonitor
        property: ACLED_EMAIL
    - secretKey: ACLED_PASSWORD
      remoteRef:
        key: worldmonitor
        property: ACLED_PASSWORD
    - secretKey: ACLED_ACCESS_TOKEN
      remoteRef:
        key: worldmonitor
        property: ACLED_ACCESS_TOKEN
    - secretKey: NASA_FIRMS_API_KEY
      remoteRef:
        key: worldmonitor
        property: NASA_FIRMS_API_KEY
    - secretKey: CLOUDFLARE_API_TOKEN
      remoteRef:
        key: worldmonitor
        property: CLOUDFLARE_API_TOKEN
    - secretKey: AVIATIONSTACK_API
      remoteRef:
        key: worldmonitor
        property: AVIATIONSTACK_API
    - secretKey: TRAVELPAYOUTS_API_TOKEN
      remoteRef:
        key: worldmonitor
        property: TRAVELPAYOUTS_API_TOKEN
