# Cluster-scoped (not namespaced) — these back the
# cert-manager.io/cluster-issuer annotation on kubernetes/dashboard/shared's
# Ingress. cert-manager is installed via ../helm's HelmRelease; the
# cluster-infra-issuers Flux Kustomization depends on cluster-infra-helm
# so this only applies once cert-manager's CRDs exist.
#
# HTTP-01 challenge, not DNS-01: no DNS-provider API credentials needed,
# but it does require the ingress-nginx controller's Service to be
# publicly reachable on port 80 for each host at issuance/renewal time.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    # Let's Encrypt sends renewal/expiry notices here — fill in a real
    # address you actually monitor.
    email: hasni9267@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: hasni9267@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx


