# Single shared instance — no variant overlays. See memory: all six
# dashboard variants point at this one relay (kubernetes/dashboard/shared
# configures WS_RELAY_URL against this Service's name).
#
#   kubectl apply -k kubernetes/ais-relay
#
# secret.example.yaml is no longer applied manually — external-secret.yaml
# fetches these values from AWS Secrets Manager instead. See its header.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - external-secret.yaml
