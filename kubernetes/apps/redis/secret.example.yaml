# Template only — NOT a kustomize resource. Copy, fill in a real password
# (openssl rand -hex 32), and apply directly or via kubectl create secret.
# Never commit a filled-in copy of this file.
#
# This exact password also has to go into kubernetes/redis-rest's
# SRH_CONNECTION_STRING (redis://:<password>@redis:6379) — Kubernetes has
# no built-in way to reference one Secret's value from another, so the
# two must be kept in sync by hand (same coupling docker-compose.yml
# resolves at compose-parse-time via one shared ${REDIS_PASSWORD}).
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
type: Opaque
stringData:
  REDIS_PASSWORD: ""
