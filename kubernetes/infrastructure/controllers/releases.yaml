apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aws-load-balancer-controller
  namespace: flux-system
spec:
  interval: 10m0s
  targetNamespace: kube-system
  chart:
    spec:
      chart: aws-load-balancer-controller
      version: 3.5.0
      sourceRef:
        kind: HelmRepository
        name: eks-charts
        namespace: flux-system
  values:
    clusterName: worldmonitor-production
    # Must match terraform/environments/production's aws_region.
    region: ap-south-1
    # From terraform output vpc_id — Flux can't read Terraform state.
    vpcId: "REPLACE_WITH_terraform_output_vpc_id"
    serviceAccount:
      annotations:
        # From terraform output aws_load_balancer_controller_role_arn — Flux
        # can't read Terraform state, so this is a manual copy-in after apply.
        eks.amazonaws.com/role-arn: "REPLACE_WITH_terraform_output_aws_load_balancer_controller_role_arn"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 10m0s
  targetNamespace: external-secrets
  install:
    createNamespace: true
  chart:
    spec:
      chart: external-secrets
      version: 2.10.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  values:
    serviceAccount:
      annotations:
        # From terraform output external_secrets_role_arn — Flux can't read
        # Terraform state, so this is a manual copy-in after apply.
        eks.amazonaws.com/role-arn: "REPLACE_WITH_terraform_output_external_secrets_role_arn"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cluster-autoscaler
  namespace: flux-system
spec:
  interval: 10m0s
  targetNamespace: kube-system
  chart:
    spec:
      chart: cluster-autoscaler
      # Chart 9.53.0 -> appVersion 1.34.2. Keep this matched to
      # terraform/environments/production's kubernetes_version — cluster-autoscaler
      # only supports a small skew from the cluster's k8s version.
      version: 9.53.0
      sourceRef:
        kind: HelmRepository
        name: autoscaler
        namespace: flux-system
  values:
    cloudProvider: aws
    # Must match terraform/environments/production's aws_region.
    awsRegion: ap-south-1
    autoDiscovery:
      # Must match local.cluster_name ("${var.project}-${var.environment}")
      # in terraform/modules/eks-node-group/main.tf — this is how the node
      # group's ASG tag k8s.io/cluster-autoscaler/<name>=owned gets discovered.
      clusterName: worldmonitor-production
    rbac:
      serviceAccount:
        create: true
        annotations:
          # From terraform output cluster_autoscaler_role_arn — Flux can't
          # read Terraform state, so this is a manual copy-in after apply.
          eks.amazonaws.com/role-arn: "REPLACE_WITH_terraform_output_cluster_autoscaler_role_arn"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 10m0s
  targetNamespace: monitoring
  install:
    createNamespace: true
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 88.6.3
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    prometheus:
      prometheusSpec:
        retention: 15d
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: gp3
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi
    grafana:
      admin:
        # From kubernetes/infrastructure/configs/monitoring's ExternalSecret
        # (applied after this HelmRelease, since it needs both the
        # external-secrets CRDs and the monitoring namespace to exist first).
        existingSecret: grafana-admin-credentials
        userKey: admin-user
        passwordKey: admin-password
      ingress:
        enabled: true
        ingressClassName: alb
        annotations:
          # Same ALB as kubernetes/apps/dashboard/shared/ingress.yaml —
          # see that file's group.name annotation.
          alb.ingress.kubernetes.io/group.name: worldmonitor
          alb.ingress.kubernetes.io/scheme: internet-facing
          alb.ingress.kubernetes.io/target-type: ip
          alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
          alb.ingress.kubernetes.io/ssl-redirect: "443"
          alb.ingress.kubernetes.io/certificate-arn: "REPLACE_WITH_your_acm_certificate_arn"
        hosts:
          - grafana.worldmonitor.alwahaj-ac-repair.com
