apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  # Single instance, matching docker-compose.yml: one redis container backed
  # by one named volume. Do not scale this past 1 — two replicas would each
  # get their own PVC-backed data directory and silently diverge.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache
    spec:
      containers:
        - name: redis
          image: docker.io/redis:7-alpine
          command: ["redis-server"]
          # $(REDIS_PASSWORD) is Kubernetes' own command/args env substitution,
          # not a shell expansion — no shell wrapper needed. --requirepass closes
          # off the network so any other pod on the cluster network can't read
          # or write cache entries without the password (defense-in-depth
          # alongside redis-rest's own SRH_TOKEN).
          args:
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
            - "--maxmemory"
            - "256mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secrets
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              # Headroom over --maxmemory 256mb for the process itself.
              memory: 320Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
