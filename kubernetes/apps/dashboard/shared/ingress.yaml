apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: worldmonitor
spec:
  ingressClassName: nginx
  rules:
    - host: worldmonitor.alwahaj-ac-repair.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: worldmonitor-full
                port:
                  name: http
    - host: tech.worldmonitor.alwahaj-ac-repair.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: worldmonitor-tech
                port:
                  name: http
    - host: finance.worldmonitor.alwahaj-ac-repair.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: worldmonitor-finance
                port:
                  name: http
    - host: happy.worldmonitor.alwahaj-ac-repair.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: worldmonitor-happy
                port:
                  name: http
    - host: commodity.worldmonitor.alwahaj-ac-repair.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: worldmonitor-commodity
                port:
                  name: http
    - host: energy.worldmonitor.alwahaj-ac-repair.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: worldmonitor-energy
                port:
                  name: http