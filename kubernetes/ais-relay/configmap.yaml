apiVersion: v1
kind: ConfigMap
metadata:
  name: ais-relay-config
data:
  MARKET_YAHOO_REFRESH_INTERVAL_MS: "900000"
  # Assumes the redis-rest Service (kubernetes/redis-rest) exists in this
  # namespace — same DNS-by-Service-name pattern as its container name in
  # docker-compose.yml.
  UPSTASH_REDIS_REST_URL: "http://redis-rest:80"
  UPSTASH_ALLOW_INSECURE_HTTP: "true"
  PORT: "3004"
