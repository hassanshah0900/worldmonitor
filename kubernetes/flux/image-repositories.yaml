# One ImageRepository per dashboard variant — each tells Flux's
# image-reflector-controller to periodically list the tags of that
# Docker Hub repository. This is read-only scanning; it doesn't change
# anything by itself. The corresponding ImagePolicy (image-policies.yaml)
# is what picks a "latest" tag out of what gets scanned here.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: worldmonitor-full
  namespace: flux-system
spec:
  image: docker.io/syedhassanshah/worldmonitor
  interval: 5m
---
