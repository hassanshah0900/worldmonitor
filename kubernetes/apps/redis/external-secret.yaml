# Replaces the manual copy-secret.example.yaml-and-apply workflow. Pulls
# from AWS Secrets Manager via ../cluster-infra/secret-store's
# ClusterSecretStore. All four components' ExternalSecrets read from the
# same "worldmonitor" AWS secret (one $0.40/mo secret instead of four) and
# each cherry-picks only its own keys via `data`, rather than `dataFrom:
# extract` — extract would copy every key in "worldmonitor" into this
# component's Secret too, widening blast radius if this pod were compromised.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: redis-secrets
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: worldmonitor
        property: REDIS_PASSWORD
