apiVersion: v1
kind: ConfigMap
metadata:
  name: worldmonitor-config
data:
  LOCAL_API_PORT: "46123"
  LOCAL_API_MODE: "docker"
  LOCAL_API_CLOUD_FALLBACK: "false"
  WM_TRUSTED_PROXY_CIDRS: ""
  # Assumes the redis-rest and ais-relay Services (from their own
  # kubernetes/<component>/ manifests) exist in this namespace under
  # these names — same DNS-by-Service-name pattern as their container
  # names in docker-compose.yml.
  UPSTASH_REDIS_REST_URL: "http://redis-rest:80"
  WS_RELAY_URL: "http://ais-relay:3004"
  # LLM provider (any OpenAI-compatible endpoint) — optional
  LLM_API_URL: ""
  LLM_MODEL: ""
