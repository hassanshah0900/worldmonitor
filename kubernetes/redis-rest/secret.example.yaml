# Template only — NOT a kustomize resource. Copy, fill in real values, and
# apply directly or via kubectl create secret. Never commit a filled-in copy.
#
# SRH_CONNECTION_STRING must embed the SAME password as
# kubernetes/redis/secret.example.yaml's REDIS_PASSWORD (Kubernetes has no
# built-in way to reference one Secret's value from another). SRH_TOKEN is
# the same value as web's UPSTASH_REDIS_REST_TOKEN
# (kubernetes/web/shared/secret.example.yaml) — this proxy is what the
# dashboard, and ais-relay, both authenticate against with that token.
apiVersion: v1
kind: Secret
metadata:
  name: redis-rest-secrets
type: Opaque
stringData:
  # Generate with: openssl rand -hex 32
  SRH_TOKEN: ""
  # redis://:<REDIS_PASSWORD>@redis:6379 — REDIS_PASSWORD from
  # kubernetes/redis/secret.example.yaml
  SRH_CONNECTION_STRING: ""
