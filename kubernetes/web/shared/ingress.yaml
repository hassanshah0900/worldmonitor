apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: worldmonitor
  annotations:
    # Start against Let's Encrypt's STAGING issuer while verifying DNS +
    # HTTP-01 challenge routing actually works — its rate limits are much
    # more forgiving than production's. Switch to letsencrypt-prod (see
    # kubernetes/cluster-infra/) only once a staging cert issues cleanly
    # for at least one host below.
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["worldmonitor.alwahaj-ac-repair.com"]
      secretName: worldmonitor-full-tls
    - hosts: ["tech.worldmonitor.alwahaj-ac-repair.com"]
      secretName: worldmonitor-tech-tls
    - hosts: ["finance.worldmonitor.alwahaj-ac-repair.com"]
      secretName: worldmonitor-finance-tls
    - hosts: ["happy.worldmonitor.alwahaj-ac-repair.com"]
      secretName: worldmonitor-happy-tls
    - hosts: ["commodity.worldmonitor.alwahaj-ac-repair.com"]
      secretName: worldmonitor-commodity-tls
    - hosts: ["energy.worldmonitor.alwahaj-ac-repair.com"]
      secretName: worldmonitor-energy-tls
  rules:
    - host: worldmonitor.alwahaj-ac-repair.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: worldmonitor-full
                port:
                  name: http
    - host: tech.worldmonitor.alwahaj-ac-repair.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: worldmonitor-tech
                port:
                  name: http
    - host: finance.worldmonitor.alwahaj-ac-repair.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: worldmonitor-finance
                port:
                  name: http
    - host: happy.worldmonitor.alwahaj-ac-repair.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: worldmonitor-happy
                port:
                  name: http
    - host: commodity.worldmonitor.alwahaj-ac-repair.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: worldmonitor-commodity
                port:
                  name: http
    - host: energy.worldmonitor.alwahaj-ac-repair.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: worldmonitor-energy
                port:
                  name: http