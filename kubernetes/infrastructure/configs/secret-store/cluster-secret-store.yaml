# Cluster-scoped (not namespaced) — every ExternalSecret in the repo
# references this by name. external-secrets is installed via
# ../../controllers's HelmRelease; the worldmonitor-infra-configs Flux
# Kustomization depends on worldmonitor-infra-controllers so this only
# applies once its CRDs exist.
#
# No auth block: the AWS SDK falls back to whatever credentials are
# available to the pod, which on an EC2-hosted node means the instance's
# IAM role — see the workers_secrets_manager IAM policy in
# terraform/modules/workers/main.tf. No AWS credentials are stored in the
# cluster or in git.
#
# region must match terraform/environments/production's aws_region.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
