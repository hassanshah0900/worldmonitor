apiVersion: apps/v1
kind: Deployment
metadata:
  name: worldmonitor
  labels:
    app.kubernetes.io/name: worldmonitor
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worldmonitor
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worldmonitor
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: worldmonitor
          image: worldmonitor:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: worldmonitor-config
            - secretRef:
                name: worldmonitor-secrets
          readinessProbe:
            httpGet:
              path: /api/sidecar-health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/sidecar-health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
