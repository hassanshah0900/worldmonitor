# Replaces the manual copy-secret.example.yaml-and-apply workflow. Pulls
# from AWS Secrets Manager via ../cluster-infra/secret-store's
# ClusterSecretStore — see secret.example.yaml for the key names this
# AWS secret's JSON value must contain.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-rest-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: redis-rest-secrets
  dataFrom:
    - extract:
        key: worldmonitor/redis-rest
