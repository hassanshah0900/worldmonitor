# Single ImageUpdateAutomation covering all six variants: it scans
# ./kubernetes/web/overlays recursively for the $imagepolicy marker
# comments in each overlay's kustomization.yaml (image-policies.yaml
# defines what each of those six ImagePolicy names resolves to), and
# for any that changed, edits newTag in place and pushes a commit.
#
# sourceRef assumes the GitRepository that `flux bootstrap` itself
# creates (conventionally named "flux-system" in the "flux-system"
# namespace, pointed at this repo/branch) — not a separate one defined
# here, so image-automation-controller commits back through the same
# credentials Flux already uses to reconcile this repo.
#
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: worldmonitor
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: learning
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: |
        chore(kubernetes): automated image update [skip ci]

        {{ range .Updated.Images }}{{ println . }}{{ end }}
    push:
      branch: learning
  update:
    path: ./kubernetes/web/overlays
    strategy: Setters
